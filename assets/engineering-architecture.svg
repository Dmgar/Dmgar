<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 182" width="100%" height="100%" role="img" aria-label="End-to-End Quantitative &amp; Full-Stack Engineering Architecture">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>

    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="35%" stop-color="#A855F7" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      }
      @keyframes streamDash {
        to { stroke-dashoffset: -28; }
      }
      .flow-line {
        stroke-dasharray: 5 5;
        animation: streamDash 1.8s linear infinite;
      }
    </style>
  </defs>

  <!-- Outer Frame -->
  <rect width="900" height="182" rx="12" fill="url(#archBg)" stroke="#21262D" stroke-width="1.5" />

  <!-- Header Bar -->
  <text x="24" y="27" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="0.8">
    END-TO-END SYSTEMS ARCHITECTURE <tspan fill="#475569">//</tspan> <tspan fill="#38BDF8">RAW DATA TO PRODUCTION INTERFACES</tspan>
  </text>
  <text x="876" y="27" text-anchor="end" class="font-mono" font-size="10" fill="#64748B">
    PROJECT FÉNIX STANDARD
  </text>
  <line x1="24" y1="37" x2="876" y2="37" stroke="#1E293B" stroke-width="1" />

  <!-- Connecting Pipeline Lines Behind Cards -->
  <line x1="212" y1="104" x2="244" y2="104" stroke="#1E293B" stroke-width="3" />
  <line x1="212" y1="104" x2="244" y2="104" stroke="#38BDF8" stroke-width="2" class="flow-line" />
  <polygon points="241,100 248,104 241,108" fill="#A855F7" />

  <line x1="432" y1="104" x2="464" y2="104" stroke="#1E293B" stroke-width="3" />
  <line x1="432" y1="104" x2="464" y2="104" stroke="#A855F7" stroke-width="2" class="flow-line" />
  <polygon points="461,100 468,104 461,108" fill="#10B981" />

  <line x1="652" y1="104" x2="684" y2="104" stroke="#1E293B" stroke-width="3" />
  <line x1="652" y1="104" x2="684" y2="104" stroke="#10B981" stroke-width="2" class="flow-line" />
  <polygon points="681,100 688,104 681,108" fill="#F97316" />

  <!-- STAGE 1: Data and Spatial Ingestion -->
  <g transform="translate(24, 50)">
    <rect width="190" height="112" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <rect width="190" height="4" rx="2" fill="#38BDF8" />
    <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">
      01 · DATA &amp; INGESTION
    </text>
    <text x="14" y="46" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">
      Analytical &amp; Spatial Stores
    </text>
    <text x="14" y="66" class="font-mono" font-size="10" fill="#94A3B8">• DuckDB · PostgreSQL</text>
    <text x="14" y="83" class="font-mono" font-size="10" fill="#94A3B8">• OSMnx Urban Road Graphs</text>
    <text x="14" y="100" class="font-mono" font-size="10" fill="#94A3B8">• NASA Lightkurve · DANE</text>
  </g>

  <!-- STAGE 2: Quantitative and ML Core -->
  <g transform="translate(244, 50)">
    <rect width="190" height="112" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <rect width="190" height="4" rx="2" fill="#A855F7" />
    <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#C084FC">
      02 · QUANT &amp; ML CORE
    </text>
    <text x="14" y="46" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">
      Algorithms &amp; Modeling
    </text>
    <text x="14" y="66" class="font-mono" font-size="10" fill="#94A3B8">• Econometrics · SciPy</text>
    <text x="14" y="83" class="font-mono" font-size="10" fill="#94A3B8">• Scikit-Learn · PCA · UMAP</text>
    <text x="14" y="100" class="font-mono" font-size="10" fill="#94A3B8">• NSGA-II · SymPy · OpenCV</text>
  </g>

  <!-- STAGE 3: High-Concurrency API -->
  <g transform="translate(464, 50)">
    <rect width="190" height="112" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <rect width="190" height="4" rx="2" fill="#10B981" />
    <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#34D399">
      03 · BACKEND &amp; RUNTIME
    </text>
    <text x="14" y="46" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">
      Modular Service Layer
    </text>
    <text x="14" y="66" class="font-mono" font-size="10" fill="#94A3B8">• FastAPI Async REST / WS</text>
    <text x="14" y="83" class="font-mono" font-size="10" fill="#94A3B8">• uv Package &amp; Env Tooling</text>
    <text x="14" y="100" class="font-mono" font-size="10" fill="#94A3B8">• Pytest 100% · Docker CI</text>
  </g>

  <!-- STAGE 4: Reactive Visualization and UI -->
  <g transform="translate(684, 50)">
    <rect width="192" height="112" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <rect width="192" height="4" rx="2" fill="#F97316" />
    <text x="14" y="24" class="font-mono" font-size="10.5" font-weight="700" fill="#FB923C">
      04 · DECISION INTERFACES
    </text>
    <text x="14" y="46" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">
      Reactive &amp; Visual Systems
    </text>
    <text x="14" y="66" class="font-mono" font-size="10" fill="#94A3B8">• Next.js 15 · React 19 · TS</text>
    <text x="14" y="83" class="font-mono" font-size="10" fill="#94A3B8">• Tailwind v4 · 60FPS Canvas</text>
    <text x="14" y="100" class="font-mono" font-size="10" fill="#94A3B8">• Plotly · Dash · Streamlit</text>
  </g>
</svg>

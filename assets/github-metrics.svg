<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 245" width="100%" height="100%" role="img" aria-label="GitHub Engineering Telemetry &amp; Language Distribution for Dariem García">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17" />
      <stop offset="100%" stop-color="#0D1117" />
    </linearGradient>
    <clipPath id="barClip">
      <rect x="0" y="0" width="404" height="10" rx="5" />
    </clipPath>
    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Outer Container -->
  <rect width="900" height="245" rx="12" fill="url(#cardBg)" stroke="#21262D" stroke-width="1.5" />

  <!-- Vertical Divider -->
  <line x1="442" y1="20" x2="442" y2="225" stroke="#1E293B" stroke-width="1.2" />

  <!-- ================= LEFT PANEL: ENGINEERING TELEMETRY ================= -->
  <text x="26" y="32" class="font-mono" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="0.6">
    GITHUB ENGINEERING TELEMETRY // @DMGAR
  </text>
  <text x="26" y="50" class="font-sans" font-size="11.5" fill="#94A3B8">
    Quantitative modeling, full-stack repositories &amp; open-source activity
  </text>

  <!-- KPI Grid (2x2) -->
  <!-- KPI 1: Commits -->
  <g transform="translate(26, 66)">
    <rect width="190" height="58" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <text x="14" y="21" class="font-mono" font-size="10" font-weight="600" fill="#64748B">AUTHORED COMMITS</text>
    <text x="14" y="45" class="font-mono" font-size="22" font-weight="800" fill="#38BDF8">255+</text>
    <text x="176" y="44" text-anchor="end" class="font-mono" font-size="9.5" fill="#22C55E">ACTIVE</text>
  </g>

  <!-- KPI 2: Public and Collab Repos -->
  <g transform="translate(228, 66)">
    <rect width="190" height="58" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <text x="14" y="21" class="font-mono" font-size="10" font-weight="600" fill="#64748B">PUBLIC &amp; COLLAB REPOS</text>
    <text x="14" y="45" class="font-mono" font-size="22" font-weight="800" fill="#F8FAFC">10 <tspan font-size="12" font-weight="600" fill="#94A3B8">+ 3 Collab</tspan></text>
  </g>

  <!-- KPI 3: Project Fénix Status -->
  <g transform="translate(26, 134)">
    <rect width="190" height="58" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <text x="14" y="21" class="font-mono" font-size="10" font-weight="600" fill="#64748B">PROJECT FÉNIX REBORN</text>
    <text x="14" y="45" class="font-mono" font-size="22" font-weight="800" fill="#F97316">4 / 5</text>
    <text x="176" y="44" text-anchor="end" class="font-mono" font-size="10" font-weight="700" fill="#FB923C">80% DONE</text>
  </g>

  <!-- KPI 4: Pure Code Volume -->
  <g transform="translate(228, 134)">
    <rect width="190" height="58" rx="8" fill="#161B22" stroke="#1E293B" stroke-width="1.2" />
    <text x="14" y="21" class="font-mono" font-size="10" font-weight="600" fill="#64748B">VERIFIED SOURCE CODE</text>
    <text x="14" y="45" class="font-mono" font-size="22" font-weight="800" fill="#A855F7">3.7 MB</text>
    <text x="176" y="44" text-anchor="end" class="font-mono" font-size="9.5" fill="#C084FC">PY · TS · SQL</text>
  </g>

  <!-- Footer Status Readout -->
  <text x="26" y="217" class="font-mono" font-size="10" fill="#64748B">
    FOCUS: <tspan fill="#94A3B8">Econometrics · Graph Optimization · Full-Stack Data Apps</tspan>
  </text>

  <!-- ================= RIGHT PANEL: TOP LANGUAGES ================= -->
  <text x="466" y="32" class="font-mono" font-size="12" font-weight="700" fill="#38BDF8" letter-spacing="0.6">
    CODEBASE LANGUAGE DISTRIBUTION
  </text>
  <text x="870" y="32" text-anchor="end" class="font-mono" font-size="9.5" fill="#64748B">
    SYNCED 2026-11-09
  </text>

  <!-- Stacked Multi-Language Bar -->
  <g transform="translate(466, 48)" clip-path="url(#barClip)">
    <rect x="0" y="0" width="168" height="10" fill="#38BDF8" />
      <rect x="168" y="0" width="97" height="10" fill="#F97316" />
      <rect x="265" y="0" width="77" height="10" fill="#3178C6" />
      <rect x="342" y="0" width="32" height="10" fill="#A855F7" />
      <rect x="374" y="0" width="27" height="10" fill="#FACC15" />
      <rect x="401" y="0" width="4" height="10" fill="#10B981" />
  </g>

  <!-- Language Breakdown Rows -->
  
    <g transform="translate(466, 96)">
      <circle cx="6" cy="-4" r="4.5" fill="#38BDF8" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Python</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="137" height="7" rx="3.5" fill="#38BDF8" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">41.5%</text>
    </g>
    <g transform="translate(466, 118)">
      <circle cx="6" cy="-4" r="4.5" fill="#F97316" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Jupyter / R&amp;D</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="79" height="7" rx="3.5" fill="#F97316" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">23.9%</text>
    </g>
    <g transform="translate(466, 140)">
      <circle cx="6" cy="-4" r="4.5" fill="#3178C6" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">TypeScript</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="63" height="7" rx="3.5" fill="#3178C6" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">19.0%</text>
    </g>
    <g transform="translate(466, 162)">
      <circle cx="6" cy="-4" r="4.5" fill="#A855F7" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">CSS / Styling</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="26" height="7" rx="3.5" fill="#A855F7" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">7.8%</text>
    </g>
    <g transform="translate(466, 184)">
      <circle cx="6" cy="-4" r="4.5" fill="#FACC15" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">JavaScript</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="22" height="7" rx="3.5" fill="#FACC15" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">6.7%</text>
    </g>
    <g transform="translate(466, 206)">
      <circle cx="6" cy="-4" r="4.5" fill="#10B981" />
      <text x="18" y="0" class="font-sans" font-size="11.5" font-weight="600" fill="#E2E8F0">Shell &amp; DevOps</text>
      <rect x="148" y="-9" width="175" height="7" rx="3.5" fill="#1E293B" />
      <rect x="148" y="-9" width="6" height="7" rx="3.5" fill="#10B981" />
      <text x="404" y="0" text-anchor="end" class="font-mono" font-size="11" font-weight="700" fill="#94A3B8">1.1%</text>
    </g>
</svg>

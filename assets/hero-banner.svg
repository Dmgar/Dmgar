<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 225" width="100%" height="100%" role="img" aria-label="Dariem García — Economist, Data Science Student &amp; Full-Stack Quantitative Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D14" />
      <stop offset="55%" stop-color="#0D1117" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="18%" cy="22%" r="48%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowFenix" cx="85%" cy="35%" r="42%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.13" />
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="65%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="35%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="70%" stop-color="#A855F7" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.7" />
    </linearGradient>

    <pattern id="techGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.55" />
    </pattern>

    <style>
      .font-sans {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
      }
      @keyframes pulseNode {
        0%, 100% { r: 4px; opacity: 0.75; }
        50% { r: 6.2px; opacity: 1; }
      }
      @keyframes pulseRing {
        0% { r: 5px; opacity: 0.7; }
        100% { r: 16px; opacity: 0; }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .node-pulse {
        animation: pulseNode 3.2s ease-in-out infinite;
      }
      .node-pulse-delay {
        animation: pulseNode 3.2s ease-in-out 1.6s infinite;
      }
      .ring-pulse {
        animation: pulseRing 2.8s cubic-bezier(0.16, 1, 0.3, 1) infinite;
      }
      .edge-flow {
        stroke-dasharray: 6 6;
        animation: dashFlow 3.5s linear infinite;
      }
      .cursor {
        animation: cursorBlink 1.1s step-end infinite;
      }
    </style>
  </defs>

  <!-- Outer Card Background -->
  <rect width="900" height="225" rx="14" fill="url(#bgGrad)" stroke="#21262D" stroke-width="1.5" />
  <rect width="900" height="225" rx="14" fill="url(#techGrid)" />
  <rect width="900" height="225" rx="14" fill="url(#glowCyan)" />
  <rect width="900" height="225" rx="14" fill="url(#glowFenix)" />

  <!-- Top Accent Border Line -->
  <path d="M 14 1.5 L 886 1.5" stroke="url(#waveGrad)" stroke-width="2" stroke-linecap="round" />

  <!-- Right Side Decorative Quantitative Graph and Harmonic Curve -->
  <g opacity="0.9">
    <!-- Harmonic / Quantitative Sine Wave -->
    <path d="M 520 118 Q 565 68, 610 105 T 700 92 T 790 78 T 875 55" fill="none" stroke="url(#waveGrad)" stroke-width="2" />
    <path d="M 520 118 Q 565 68, 610 105 T 700 92 T 790 78 T 875 55" fill="none" stroke="#38BDF8" stroke-width="1.2" class="edge-flow" opacity="0.65" />

    <!-- Network Graph Edges -->
    <line x1="655" y1="44" x2="725" y2="34" stroke="#334155" stroke-width="1.2" />
    <line x1="725" y1="34" x2="795" y2="62" stroke="#334155" stroke-width="1.2" />
    <line x1="795" y1="62" x2="852" y2="38" stroke="#334155" stroke-width="1.2" />
    <line x1="655" y1="44" x2="695" y2="92" stroke="#334155" stroke-width="1.2" />
    <line x1="725" y1="34" x2="695" y2="92" stroke="#38BDF8" stroke-width="1.2" class="edge-flow" opacity="0.7" />
    <line x1="695" y1="92" x2="772" y2="112" stroke="#334155" stroke-width="1.2" />
    <line x1="795" y1="62" x2="772" y2="112" stroke="#A855F7" stroke-width="1.2" class="edge-flow" opacity="0.7" />
    <line x1="772" y1="112" x2="850" y2="96" stroke="#334155" stroke-width="1.2" />
    <line x1="852" y1="38" x2="850" y2="96" stroke="#F97316" stroke-width="1.2" class="edge-flow" opacity="0.65" />

    <!-- Network Graph Nodes -->
    <circle cx="655" cy="44" r="3.5" fill="#38BDF8" />
    <circle cx="725" cy="34" r="4.5" fill="#38BDF8" class="node-pulse" />
    <circle cx="725" cy="34" r="5" fill="none" stroke="#38BDF8" stroke-width="1.2" class="ring-pulse" />

    <circle cx="695" cy="92" r="4" fill="#A855F7" />
    <circle cx="795" cy="62" r="5" fill="#F97316" class="node-pulse-delay" />
    <circle cx="772" cy="112" r="3.8" fill="#38BDF8" />
    <circle cx="852" cy="38" r="4" fill="#F97316" />
    <circle cx="850" cy="96" r="3.5" fill="#A855F7" />

    <!-- Telemetry Mini Readout -->
    <rect x="692" y="118" width="176" height="22" rx="5" fill="#0D1117" fill-opacity="0.85" stroke="#1E293B" stroke-width="1" />
    <text x="702" y="133" class="font-mono" font-size="9.5" fill="#94A3B8">
      <tspan fill="#38BDF8">NSGA-II</tspan> · <tspan fill="#A855F7">Markov</tspan> · <tspan fill="#F97316">R²&gt;0.998</tspan>
    </text>
  </g>

  <!-- Top Status Pill -->
  <g transform="translate(32, 24)">
    <rect x="0" y="0" width="388" height="24" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1" />
    <circle cx="14" cy="12" r="4" fill="#22C55E" />
    <circle cx="14" cy="12" r="4" fill="none" stroke="#22C55E" stroke-width="1.2" class="ring-pulse" />
    <text x="26" y="16" class="font-mono" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.4">
      CARTAGENA, COLOMBIA <tspan fill="#475569">·</tspan> <tspan fill="#38BDF8">ECON &amp; DATA SCIENCE @ UTB</tspan>
    </text>
  </g>

  <!-- Main Heading: Name -->
  <text x="32" y="88" class="font-sans" font-size="36" font-weight="800" fill="url(#titleGrad)" letter-spacing="-0.5">
    Dariem García
  </text>

  <!-- Terminal Subtitle with Animated Cursor -->
  <text x="32" y="116" class="font-mono" font-size="13.5" font-weight="600" fill="#38BDF8">
    &gt; Quantitative Modeling, Graph Optimization &amp; Full-Stack Data Systems<tspan class="cursor" fill="#F97316">_</tspan>
  </text>

  <!-- Secondary Tagline -->
  <text x="32" y="137" class="font-sans" font-size="12.5" fill="#94A3B8">
    Bridging rigorous economic &amp; mathematical theory with production-grade software engineering.
  </text>

  <!-- Bottom 3 Domain Cards -->
  <!-- Card 1: Econometrics and ML -->
  <g transform="translate(32, 154)">
    <rect x="0" y="0" width="268" height="50" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#38BDF8" />
    <text x="14" y="20" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8" letter-spacing="0.5">
      01 // ECONOMETRICS &amp; ML
    </text>
    <text x="14" y="37" class="font-sans" font-size="11.5" fill="#CBD5E1">
      Causal Inference · Scikit-Learn · UMAP/PCA
    </text>
  </g>

  <!-- Card 2: Graph and Stochastic Optimization -->
  <g transform="translate(316, 154)">
    <rect x="0" y="0" width="268" height="50" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#A855F7" />
    <text x="14" y="20" class="font-mono" font-size="10.5" font-weight="700" fill="#C084FC" letter-spacing="0.5">
      02 // GRAPH &amp; STOCHASTIC MODELS
    </text>
    <text x="14" y="37" class="font-sans" font-size="11.5" fill="#CBD5E1">
      OSMnx · NetworkX · NSGA-II · Markov (SymPy)
    </text>
  </g>

  <!-- Card 3: Full-Stack and Scientific Systems -->
  <g transform="translate(600, 154)">
    <rect x="0" y="0" width="268" height="50" rx="8" fill="#161B22" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />
    <rect x="0" y="0" width="4" height="50" rx="2" fill="#F97316" />
    <text x="14" y="20" class="font-mono" font-size="10.5" font-weight="700" fill="#FB923C" letter-spacing="0.5">
      03 // FULL-STACK &amp; ASTRODATA
    </text>
    <text x="14" y="37" class="font-sans" font-size="11.5" fill="#CBD5E1">
      FastAPI · Next.js 15 · DuckDB · OpenCV · Lightkurve
    </text>
  </g>
</svg>
